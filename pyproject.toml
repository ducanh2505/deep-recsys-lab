[project]
name = "ml20m-lightgcn-prep"
version = "0.1.0"
description = "MovieLens 20M preparation, LightGCN and Mult-VAE training"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "polars>=1.44.2",
    "torch>=2.14.0",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
content = [
    "transformers>=4.51.0,<5",
    "peft>=0.17,<0.19",
    "accelerate>=1.10,<2",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.6,<1",
]
