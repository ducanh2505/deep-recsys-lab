[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recsys-platform"
version = "0.1.0"
description = "Composable infrastructure for training, evaluating, and serving recommendation systems."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hydra-core>=1.3.2,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pydantic>=2.7,<3",
  "scipy>=1.13,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# Install exactly one accelerator extra. uv resolves each PyTorch wheel from an
# explicit index, while the application itself remains accelerator agnostic.
cpu = ["torch>=2.5,<3"]
mps = ["torch>=2.5,<3"]
cu126 = ["torch>=2.5,<3"]
train = [
  "onnx>=1.22,<2",
  "onnxscript>=0.7,<1",
]
hybrid = [
  "httpx>=0.27,<1",
  "lightgbm>=4.5,<5",
]
serve = [
  "bentoml>=1.4.39,<1.5",
  "httpx>=0.27,<1",
  "onnxruntime>=1.29,<2",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
recsys = "recsys.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "mps" }],
  [{ extra = "cpu" }, { extra = "cu126" }],
  [{ extra = "mps" }, { extra = "cu126" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = []
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: end-to-end workflow tests",
]

[tool.coverage.run]
branch = true
source = ["recsys"]
omit = [
  "src/recsys/cli/*",
  "src/recsys/serving/bento.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
