[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-recsys-lab"
version = "0.1.0"
description = "Movie recommender lifecycle showcase"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.8,<3",
    "fastapi>=0.115,<1",
    "lightgbm>=4.5,<5",
    "pyarrow>=18,<23",
    "torch>=2.5,<3",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
movie-recsys = "deep_recsys_lifecycle.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deep_recsys_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
