name: ci

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra cpu --extra train --extra hybrid --extra serve --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=recsys --cov-report=term-missing --cov-fail-under=85

  synthetic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra cpu --extra train --extra hybrid --extra serve --extra dev
      - run: uv run pytest tests/integration -m integration

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel
      - name: Install and execute outside checkout
        run: |
          python -m venv /tmp/recsys-wheel
          /tmp/recsys-wheel/bin/pip install dist/recsys_platform-*.whl
          cd /tmp
          /tmp/recsys-wheel/bin/recsys plugins list
          /tmp/recsys-wheel/bin/python -c \
            'from importlib.resources import files; assert files("recsys.conf").joinpath("config.yaml").is_file()'
          /tmp/recsys-wheel/bin/recsys --workspace-root /tmp/recsys-work data prepare \
            dataset.parameters.users=3 \
            dataset.parameters.items=8 \
            dataset.parameters.interactions_per_user=4

  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra cpu --extra train --extra serve
      - name: Build a synthetic artifact
        run: >-
          uv run recsys --workspace-root . run
          dataset=synthetic model=multivae training.epochs=1
          dataset.parameters.users=8 dataset.parameters.items=20
          dataset.parameters.interactions_per_user=6
      - run: docker build -f infra/docker/api.Dockerfile -t recsys-platform:smoke .
      - name: Start API and verify contracts
        shell: bash
        run: |
          ARTIFACT=$(find "$PWD/var/models/multivae" -mindepth 1 -maxdepth 1 -type d | head -1)
          docker run --detach --rm --name recsys-api -p 18000:3000 -v "$ARTIFACT:/artifact:ro" recsys-platform:smoke
          trap 'docker stop recsys-api' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/model
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data '{"user_id":"user-0000","top_k":2}' \
            http://127.0.0.1:18000/recommend
          curl --fail --silent http://127.0.0.1:18000/metrics
