name: deep-recsys-lab

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    command:
      - bentoml
      - serve
      - src/service.py:RecommendationService
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --arg
      - "model_tag=${MODEL_TAG:-deep_recsys:multvae-onnx-v1}"
    environment:
      BENTOML_HOME: /home/app/bentoml
      DEEP_RECSYS_API_KEY: "${DEEP_RECSYS_API_KEY:-}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: "${BENTOML_HOST_HOME:-${HOME}/bentoml}/models"
        target: /home/app/bentoml/models
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:3000/readyz", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    init: true
    command:
      - python
      - scripts/serve_model_ui.py
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --backend-url
      - http://backend:3000
      - --ui-file
      - /app/api.html
    ports:
      - "${HOST_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    stop_grace_period: 10s
