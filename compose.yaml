name: recsys-platform

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    init: true
    environment:
      RECSYS_API_KEY: "${RECSYS_API_KEY:-}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: "${RECSYS_ARTIFACT:?Set RECSYS_ARTIFACT to an immutable artifact directory}"
        target: /artifact
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:3000/readyz", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 15s
